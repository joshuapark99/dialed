name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: dialed_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dialed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_REVISION: 0123456789abcdef0123456789abcdef01234567
      APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialed_test
      DIALED_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dialed_test
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply runtime migrations twice
        run: pnpm test:db-integration
      - name: Build and verify API readiness
        run: |
          pnpm --filter @dialed/db --filter @dialed/api build
          pnpm --filter @dialed/api start >/tmp/dialed-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          if ! node --input-type=module -e '
            const deadline = Date.now() + 30_000;
            while (Date.now() < deadline) {
              try {
                const response = await fetch("http://127.0.0.1:3001/readyz");
                const body = await response.json();
                if (response.ok && body.status === "ready" && body.revision === process.env.APP_REVISION) process.exit(0);
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 500));
            }
            process.exit(1);
          '; then
            cat /tmp/dialed-api.log
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  containers:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        if: matrix.arch == 'amd64'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0
      - name: Set up Node.js
        if: matrix.arch == 'amd64'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - if: matrix.arch == 'amd64'
        run: pnpm install --frozen-lockfile
      - name: Verify POC topology and operations contracts
        if: matrix.arch == 'amd64'
        run: pnpm test:ops
      - name: Validate Alloy configuration
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm \
            -v "$PWD/ops/poc/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.19.0 \
            validate /etc/alloy/config.alloy
      - name: Build both targets for ${{ matrix.arch }}
        run: |
          docker buildx build --target web --platform "${{ matrix.platform }}" --build-arg VCS_REF="$GITHUB_SHA" --load -t dialed-web:ci .
          docker buildx build --target api --platform "${{ matrix.platform }}" --build-arg VCS_REF="$GITHUB_SHA" --load -t dialed-api:ci .
      - name: Inspect production image boundaries
        run: |
          for image in dialed-web:ci dialed-api:ci; do
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = node
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
            test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' "$image")" != null
          done
          docker run --rm --entrypoint sh dialed-api:ci -ec '
            test -f /app/dist/migrate.js
            test -n "$(find /app -path "*/migrations/*.sql" -print -quit)"
            test -z "$(find /app \( -path "*/node_modules/drizzle-kit" -o -path "*/node_modules/esbuild" \) -print -quit)"
          '
      - name: Exercise production container health checks
        run: |
          cleanup() {
            docker rm -f dialed-web-ci dialed-api-ci dialed-postgres-ci >/dev/null 2>&1 || true
            docker network rm dialed-ci >/dev/null 2>&1 || true
          }
          wait_healthy() {
            container=$1
            for _attempt in $(seq 1 60); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
              if [ "$status" = healthy ]; then return 0; fi
              if [ "$status" = unhealthy ]; then break; fi
              sleep 2
            done
            docker logs "$container"
            return 1
          }
          trap cleanup EXIT
          docker network create dialed-ci
          docker run -d --name dialed-postgres-ci --network dialed-ci \
            -e POSTGRES_DB=dialed -e POSTGRES_USER=dialed -e POSTGRES_PASSWORD=dialed \
            postgres:16.15-alpine3.24
          for _attempt in $(seq 1 60); do
            if docker exec dialed-postgres-ci pg_isready -U dialed -d dialed; then break; fi
            sleep 1
          done
          docker exec dialed-postgres-ci pg_isready -U dialed -d dialed
          docker run --rm --network dialed-ci \
            -e DATABASE_URL=postgresql://dialed:dialed@dialed-postgres-ci:5432/dialed \
            dialed-api:ci node dist/migrate.js
          docker run -d --name dialed-api-ci --network dialed-ci --network-alias api \
            -e API_HOST=0.0.0.0 \
            -e APP_URL=http://dialed-web-ci:3000 \
            -e DATABASE_URL=postgresql://dialed:dialed@dialed-postgres-ci:5432/dialed \
            -e BETTER_AUTH_SECRET=ci-only-secret-ci-only-secret-ci \
            -e GOOGLE_CLIENT_ID=ci-google-client \
            -e GOOGLE_CLIENT_SECRET=ci-google-secret \
            dialed-api:ci
          wait_healthy dialed-api-ci
          docker run -d --name dialed-web-ci --network dialed-ci \
            -e HOSTNAME=0.0.0.0 -e PORT=3000 \
            dialed-web:ci
          wait_healthy dialed-web-ci

  publish:
    needs: [verify, audit, database, e2e, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            image: ghcr.io/joshuapark99/dialed-web
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - target: web
            image: ghcr.io/joshuapark99/dialed-web
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - target: api
            image: ghcr.io/joshuapark99/dialed-api
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - target: api
            image: ghcr.io/joshuapark99/dialed-api
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish native image digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: VCS_REF=${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifests:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download web image digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: digests-web-*
          path: /tmp/digests/web
          merge-multiple: true
      - name: Download API image digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: digests-api-*
          path: /tmp/digests/api
          merge-multiple: true
      - name: Assemble and promote multi-platform images
        id: manifests
        env:
          WEB_IMAGE: ghcr.io/joshuapark99/dialed-web
          API_IMAGE: ghcr.io/joshuapark99/dialed-api
        run: |
          create_manifest() {
            image=$1
            digest_directory=$2
            references=()
            while IFS= read -r digest_file; do
              references+=("$image@sha256:$(basename "$digest_file")")
            done < <(find "$digest_directory" -maxdepth 1 -type f | sort)
            test "${#references[@]}" -eq 2
            docker buildx imagetools create \
              --tag "$image:sha-${{ github.sha }}" \
              "${references[@]}"
          }

          create_manifest "$WEB_IMAGE" /tmp/digests/web
          create_manifest "$API_IMAGE" /tmp/digests/api

          docker buildx imagetools create \
            --tag "$WEB_IMAGE:poc" \
            "$WEB_IMAGE:sha-${{ github.sha }}"
          docker buildx imagetools create \
            --tag "$API_IMAGE:poc" \
            "$API_IMAGE:sha-${{ github.sha }}"

          web_digest=$(docker buildx imagetools inspect "$WEB_IMAGE:sha-${{ github.sha }}" --format '{{.Manifest.Digest}}')
          api_digest=$(docker buildx imagetools inspect "$API_IMAGE:sha-${{ github.sha }}" --format '{{.Manifest.Digest}}')
          echo "web-digest=$web_digest" >> "$GITHUB_OUTPUT"
          echo "api-digest=$api_digest" >> "$GITHUB_OUTPUT"
      - name: Attest web image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/joshuapark99/dialed-web
          subject-digest: ${{ steps.manifests.outputs.web-digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest API image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/joshuapark99/dialed-api
          subject-digest: ${{ steps.manifests.outputs.api-digest }}
          push-to-registry: true
          create-storage-record: false

  smoke:
    needs: publish-manifests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: poc
    concurrency:
      group: poc-release
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Verify the publicly deployed revision
        env:
          APP_REVISION: ${{ github.sha }}
          POC_BASE_URL: ${{ vars.POC_BASE_URL }}
        run: node ops/poc/bin/check-external.mjs
