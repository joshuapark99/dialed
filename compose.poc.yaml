name: dialed-poc

services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - type: bind
        source: ${DIALED_DATA_DIR:?DIALED_DATA_DIR is required}/postgres
        target: /var/lib/postgresql/data
    networks:
      app: null
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    labels:
      io.dialed.revision: ${APP_REVISION:?APP_REVISION is required}
    logging:
      driver: journald
      options:
        tag: "dialed-poc/{{.Name}}"
        labels: "com.docker.compose.service,io.dialed.revision"

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: "no"
    command: ["node", "dist/migrate.js"]
    environment:
      APP_REVISION: ${APP_REVISION:?APP_REVISION is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      app: null
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      io.dialed.revision: ${APP_REVISION:?APP_REVISION is required}
    logging:
      driver: journald
      options:
        tag: "dialed-poc/{{.Name}}"
        labels: "com.docker.compose.service,io.dialed.revision"

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      APP_REVISION: ${APP_REVISION:?APP_REVISION is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      app: null
      api-egress: null
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    labels:
      io.dialed.revision: ${APP_REVISION:?APP_REVISION is required}
    logging:
      driver: journald
      options:
        tag: "dialed-poc/{{.Name}}"
        labels: "com.docker.compose.service,io.dialed.revision"

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_REVISION: ${APP_REVISION:?APP_REVISION is required}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    networks:
      app: null
      ingress: null
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=0750
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    labels:
      io.dialed.revision: ${APP_REVISION:?APP_REVISION is required}
    logging:
      driver: journald
      options:
        tag: "dialed-poc/{{.Name}}"
        labels: "com.docker.compose.service,io.dialed.revision"

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    depends_on:
      web:
        condition: service_healthy
    networks:
      ingress: null
      tunnel-egress: null
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    labels:
      io.dialed.revision: ${APP_REVISION:?APP_REVISION is required}
    logging:
      driver: journald
      options:
        tag: "dialed-poc/{{.Name}}"
        labels: "com.docker.compose.service,io.dialed.revision"

networks:
  app:
    driver: bridge
    internal: true
  ingress:
    driver: bridge
    internal: true
  api-egress:
    driver: bridge
  tunnel-egress:
    driver: bridge
