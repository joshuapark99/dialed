services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dialed
      POSTGRES_USER: dialed
      POSTGRES_PASSWORD: dialed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dialed -d dialed"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - dialed-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      target: api
    command:
      [
        "sh",
        "-c",
        "pnpm --filter @dialed/db db:migrate && node apps/api/dist/main.js",
      ]
    environment:
      APP_URL: http://localhost:3000
      API_PORT: 3001
      DATABASE_URL: postgresql://dialed:dialed@postgres:5432/dialed
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-google-disabled}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      target: web
      args:
        API_INTERNAL_URL: http://api:3001
    environment:
      API_INTERNAL_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  dialed-postgres:
