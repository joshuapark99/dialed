name: dialed-observability

services:
  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dialed-poc-overview.json
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - type: bind
        source: ${DIALED_OBSERVABILITY_DIR:?DIALED_OBSERVABILITY_DIR is required}/grafana
        target: /var/lib/grafana
      - type: bind
        source: ${DIALED_OBSERVABILITY_CONFIG_DIR:-./ops/poc/observability}/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ${DIALED_OBSERVABILITY_CONFIG_DIR:-./ops/poc/observability}/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
    networks:
      observability: null
    mem_limit: 512m
    cpus: "1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    user: "10001:10001"
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - type: bind
        source: ${DIALED_OBSERVABILITY_CONFIG_DIR:-./ops/poc/observability}/loki.yaml
        target: /etc/loki/config.yaml
        read_only: true
      - type: bind
        source: ${DIALED_OBSERVABILITY_DIR:?DIALED_OBSERVABILITY_DIR is required}/loki
        target: /loki
    networks:
      observability: null
    mem_limit: 512m
    cpus: "1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - type: bind
        source: ${DIALED_OBSERVABILITY_CONFIG_DIR:-./ops/poc/observability}/prometheus.yaml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ${DIALED_OBSERVABILITY_DIR:?DIALED_OBSERVABILITY_DIR is required}/prometheus
        target: /prometheus
    networks:
      observability: null
    mem_limit: 384m
    cpus: "1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  observability:
    driver: bridge
    internal: true
